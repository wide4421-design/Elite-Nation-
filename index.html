<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Elite Nation</title>

    <!-- Firebase SDK (Compat) -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js">
    </script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js">
    </script>

    <style>
        /* ── same styles as before ── */
        :root {
            --bg: #0a0e17;
            --card: #111827;
            --accent: #f7931a;
            --accent2: #3b82f6;
            --gold: #f59e0b;
            --green: #10b981;
            --red: #ef4444;
            --text: #e2e8f0;
            --text2: #94a3b8;
            --border: #1e293b;
            --input: #1a1f2e;
            --shadow: 0 4px 24px rgba(0, 0, 0, 0.4);
            --radius: 14px;
            --toast-bg: #1e293b;
            --modal-bg: #111827;
            --scrollbar: #1e293b;
        }

        [data-theme="light"] {
            --bg: #f1f5f9;
            --card: #ffffff;
            --text: #0f172a;
            --text2: #475569;
            --border: #e2e8f0;
            --input: #f8fafc;
            --shadow: 0 4px 24px rgba(0, 0, 0, 0.08);
            --toast-bg: #ffffff;
            --modal-bg: #ffffff;
            --scrollbar: #cbd5e1;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            overflow-x: hidden;
            transition: background 0.3s, color 0.3s;
            background-image: radial-gradient(ellipse at top, #1a1f3508 0%, transparent 60%),
                radial-gradient(ellipse at bottom right, #f7931a08 0%, transparent 50%);
        }

        [data-theme="light"] body {
            background-image: radial-gradient(ellipse at top, #f1f5f9 0%, transparent 60%),
                radial-gradient(ellipse at bottom right, #f7931a08 0%, transparent 50%);
        }

        .app-container {
            max-width: 480px;
            margin: 0 auto;
            min-height: 100vh;
            position: relative;
            background: var(--bg);
            box-shadow: var(--shadow);
            transition: background 0.3s;
        }

        @media(min-width:768px) {
            .app-container {
                max-width: 500px;
                border-left: 1px solid var(--border);
                border-right: 1px solid var(--border);
            }
        }

        .screen {
            display: none;
            padding: 20px 16px;
            min-height: 100vh;
            animation: fadeIn .35s ease;
        }
        .screen.active {
            display: block;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(12px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .logo {
            text-align: center;
            font-size: 2rem;
            font-weight: 800;
            letter-spacing: -1px;
            background: linear-gradient(135deg, #f7931a, #f59e0b);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 6px;
        }

        .logo-sub {
            text-align: center;
            font-size: 0.8rem;
            color: var(--text2);
            margin-bottom: 20px;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .card {
            background: var(--card);
            border-radius: var(--radius);
            padding: 20px;
            margin-bottom: 14px;
            border: 1px solid var(--border);
            box-shadow: 0 2px 12px #00000020;
            transition: background 0.3s, border 0.3s;
        }

        .card h3 {
            font-size: 1rem;
            margin-bottom: 12px;
            color: var(--text);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        input,
        select,
        textarea {
            width: 100%;
            padding: 13px 14px;
            border-radius: 10px;
            border: 1px solid var(--border);
            background: var(--input);
            color: var(--text);
            font-size: 0.9rem;
            margin-bottom: 10px;
            transition: all .2s;
            font-family: inherit;
        }

        input:focus,
        select:focus,
        textarea:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 3px #f7931a20;
        }

        textarea {
            resize: vertical;
            min-height: 80px;
        }

        .btn {
            padding: 13px 20px;
            border-radius: 10px;
            border: none;
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all .25s;
            width: 100%;
            letter-spacing: 0.3px;
        }

        .btn-gold {
            background: linear-gradient(135deg, #f7931a, #e67e0e);
            color: #000;
            box-shadow: 0 4px 14px #f7931a40;
        }
        .btn-gold:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 22px #f7931a55;
        }

        .btn-blue {
            background: linear-gradient(135deg, #3b82f6, #2563eb);
            color: #fff;
            box-shadow: 0 4px 14px #3b82f640;
        }
        .btn-blue:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 22px #3b82f655;
        }

        .btn-outline {
            background: transparent;
            border: 2px solid var(--border);
            color: var(--text);
        }
        .btn-outline:hover {
            border-color: var(--accent);
            color: var(--accent);
        }

        .btn-sm {
            padding: 8px 14px;
            font-size: 0.78rem;
            width: auto;
            border-radius: 8px;
        }
        .btn-danger {
            background: var(--red);
            color: #fff;
        }
        .btn-success {
            background: var(--green);
            color: #fff;
        }

        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }
        .grid-3 {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
        }

        .badge {
            display: inline-block;
            padding: 5px 10px;
            border-radius: 20px;
            font-size: 0.7rem;
            font-weight: 600;
            letter-spacing: 0.5px;
        }
        .badge-gold {
            background: #f7931a20;
            color: #f7931a;
        }
        .badge-green {
            background: #10b98120;
            color: #10b981;
        }
        .badge-red {
            background: #ef444420;
            color: #ef4444;
        }
        .badge-blue {
            background: #3b82f620;
            color: #3b82f6;
        }

        .dashboard-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 0;
            border-bottom: 1px solid var(--border);
            margin-bottom: 14px;
            flex-wrap: wrap;
            gap: 8px;
        }

        .user-info-top {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .avatar {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            background: var(--accent);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            color: #000;
            font-size: 1.1rem;
            overflow: hidden;
            flex-shrink: 0;
        }
        .avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .marquee-bar {
            background: #f7931a15;
            border: 1px solid #f7931a30;
            border-radius: 8px;
            padding: 10px 14px;
            margin-bottom: 14px;
            overflow: hidden;
            white-space: nowrap;
            font-size: 0.8rem;
            color: #f7931a;
            letter-spacing: 0.5px;
        }
        .marquee-bar span {
            display: inline-block;
            animation: marquee 14s linear infinite;
        }
        @keyframes marquee {
            0% {
                transform: translateX(100%);
            }
            100% {
                transform: translateX(-100%);
            }
        }

        .icon-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
        }
        .icon-item {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 16px 10px;
            text-align: center;
            cursor: pointer;
            transition: all .2s;
            font-size: 0.75rem;
            color: var(--text2);
        }
        .icon-item:hover {
            border-color: var(--accent);
            color: var(--text);
            transform: translateY(-2px);
        }
        .icon-item .ico {
            font-size: 1.6rem;
            display: block;
            margin-bottom: 6px;
        }

        .plan-card {
            border: 2px solid var(--border);
            border-radius: var(--radius);
            padding: 16px;
            cursor: pointer;
            transition: all .25s;
            text-align: center;
            background: var(--card);
        }
        .plan-card:hover,
        .plan-card.selected {
            border-color: var(--accent);
            box-shadow: 0 0 20px #f7931a25;
        }
        .plan-card h4 {
            font-size: 1.1rem;
            margin-bottom: 4px;
        }
        .plan-card .price {
            font-size: 1.4rem;
            font-weight: 700;
            color: var(--accent);
        }

        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000000cc;
            z-index: 999;
            display: flex;
            align-items: center;
            justify-content: center;
            animation: fadeIn .2s;
        }
        .modal {
            background: var(--modal-bg);
            border-radius: var(--radius);
            padding: 24px;
            width: 90%;
            max-width: 440px;
            max-height: 80vh;
            overflow-y: auto;
            border: 1px solid var(--border);
            transition: background 0.3s;
        }
        .modal::-webkit-scrollbar {
            width: 6px;
        }
        .modal::-webkit-scrollbar-track {
            background: var(--scrollbar);
        }
        .modal::-webkit-scrollbar-thumb {
            background: var(--accent);
            border-radius: 10px;
        }

        .notification-badge {
            position: relative;
            cursor: pointer;
            font-size: 1.4rem;
        }
        .notification-badge .count {
            position: absolute;
            top: -6px;
            right: -8px;
            background: var(--red);
            color: #fff;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            font-size: 0.65rem;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
        }

        .tab-nav {
            display: flex;
            gap: 4px;
            margin-bottom: 14px;
            flex-wrap: wrap;
        }
        .tab-nav button {
            padding: 8px 16px;
            border-radius: 20px;
            border: 1px solid var(--border);
            background: transparent;
            color: var(--text2);
            cursor: pointer;
            font-size: 0.78rem;
            transition: all .2s;
        }
        .tab-nav button.active {
            background: var(--accent);
            color: #000;
            border-color: var(--accent);
            font-weight: 600;
        }

        .chat-bubble {
            padding: 10px 14px;
            border-radius: 16px;
            margin: 6px 0;
            max-width: 80%;
            font-size: 0.85rem;
        }
        .chat-bubble.user {
            background: var(--accent2);
            color: #fff;
            margin-left: auto;
            border-bottom-right-radius: 4px;
        }
        .chat-bubble.admin {
            background: #1e293b;
            color: var(--text);
            margin-right: auto;
            border-bottom-left-radius: 4px;
        }
        [data-theme="light"] .chat-bubble.admin {
            background: #e2e8f0;
            color: #0f172a;
        }

        .chat-image {
            max-width: 200px;
            border-radius: 10px;
            cursor: zoom-in;
        }

        .toast {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--toast-bg);
            border: 1px solid var(--accent);
            padding: 12px 20px;
            border-radius: 30px;
            z-index: 9999;
            font-weight: 600;
            font-size: 0.85rem;
            animation: fadeIn .3s;
            box-shadow: 0 8px 30px #00000060;
            color: var(--text);
            transition: background 0.3s, color 0.3s;
        }

        .theme-toggle {
            background: transparent;
            border: 1px solid var(--border);
            border-radius: 50%;
            width: 38px;
            height: 38px;
            font-size: 1.2rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all .2s;
            color: var(--text);
            flex-shrink: 0;
        }
        .theme-toggle:hover {
            border-color: var(--accent);
            transform: rotate(15deg);
        }

        @media(max-width:480px) {
            .icon-grid {
                grid-template-columns: repeat(3, 1fr);
                gap: 6px;
            }
            .icon-item {
                padding: 12px 6px;
                font-size: 0.7rem;
            }
            .icon-item .ico {
                font-size: 1.3rem;
            }
            .grid-2 {
                gap: 6px;
            }
            .grid-3 {
                gap: 4px;
            }
            .card {
                padding: 14px;
            }
            .dashboard-header {
                padding: 8px 0;
            }
        }
    </style>
</head>
<body>

    <div class="app-container" id="appContainer"></div>
    <div id="toastContainer"></div>
    <div id="modalContainer"></div>
    <audio id="notifSound" preload="auto">
        <source src="data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEARKwAAIhYAQACABAAZGF0YQAAAAA=" type="audio/wav">
    </audio>

    <script>
        // ============================================================
        // 1. FIREBASE INIT – new config (fully configured)
        // ============================================================
        const firebaseConfig = {
            apiKey: "AIzaSyBkzQMU2N_my7DYVvbjl2A0813LSoqpZeY",
            authDomain: "elite-nation-12282.firebaseapp.com",
            databaseURL: "https://elite-nation-12282-default-rtdb.firebaseio.com",
            projectId: "elite-nation-12282",
            storageBucket: "elite-nation-12282.firebasestorage.app",
            messagingSenderId: "158135799550",
            appId: "1:158135799550:web:46f6b592da2e514868dfaf"
        };

        let firebaseApp, firebaseDb;
        let firebaseReady = false;

        try {
            if (typeof firebase !== 'undefined') {
                firebaseApp = firebase.initializeApp(firebaseConfig);
                firebaseDb = firebase.database();
                firebaseReady = true;
                console.log('🔥 Firebase initialized successfully (Elite Nation v2)');
            } else {
                console.warn('⚠️ Firebase SDK not loaded, using localStorage only');
            }
        } catch (e) {
            console.warn('⚠️ Firebase init failed, using localStorage fallback:', e);
            firebaseReady = false;
        }

        // ============================================================
        // 2. DATA MANAGER – fast local-first, background Firebase sync
        // ============================================================
        const DataManager = {
            _cache: {},
            _initialized: false,
            _listenerRef: null,

            // Loads localStorage synchronously, then sets up Firebase listener in background
            init() {
                if (this._initialized) return;
                this._loadFromLocalStorage();
                this._initialized = true;

                if (firebaseReady) {
                    this._setupListener();
                    console.log('📁 Firebase listener attached (background sync)');
                } else {
                    console.log('📁 Using localStorage only (no Firebase)');
                }
            },

            _loadFromLocalStorage() {
                const keys = ['users', 'pendingFee', 'pendingWithdrawals', 'approvedWithdrawals',
                    'tasks', 'notifications', 'marqueeText', 'companyDocs', 'chatMessages',
                    'subAdmins', 'paymentConfig', 'adminProfilePic', 'currentUserId'
                ];
                const data = {};
                keys.forEach(k => {
                    try {
                        const raw = localStorage.getItem('en_' + k);
                        data[k] = raw ? JSON.parse(raw) : null;
                    } catch (e) { data[k] = null; }
                });
                const userTasks = {};
                for (let key in localStorage) {
                    if (key.startsWith('en_userTasks_')) {
                        try {
                            const uid = key.replace('en_userTasks_', '');
                            userTasks[uid] = JSON.parse(localStorage.getItem(key));
                        } catch (e) {}
                    }
                }
                data.userTasks = userTasks;
                this._cache = data;
            },

            _saveToLocalStorage(data) {
                for (let key in data) {
                    if (key === 'userTasks') {
                        for (let uid in data.userTasks) {
                            localStorage.setItem('en_userTasks_' + uid, JSON.stringify(data.userTasks[uid]));
                        }
                        continue;
                    }
                    localStorage.setItem('en_' + key, JSON.stringify(data[key]));
                }
            },

            _setupListener() {
                if (!firebaseReady) return;
                if (this._listenerRef) {
                    this._listenerRef.off();
                }
                const ref = firebaseDb.ref('/');
                this._listenerRef = ref;
                ref.on('value', (snapshot) => {
                    const data = snapshot.val() || {};
                    for (let key in data) {
                        if (data.hasOwnProperty(key)) {
                            this._cache[key] = data[key];
                        }
                    }
                    this._saveToLocalStorage(this._cache);
                    if (this._onChangeCallback) {
                        this._onChangeCallback(data);
                    }
                    console.log('🔄 Firebase sync update received');
                }, (error) => {
                    console.warn('⚠️ Firebase listener error:', error);
                });
            },

            onChange(cb) {
                this._onChangeCallback = cb;
            },

            get(key, def = null) {
                const val = this._cache[key];
                return val !== undefined ? val : def;
            },

            set(key, val) {
                this._cache[key] = val;
                if (key === 'userTasks') {
                    for (let uid in val) {
                        localStorage.setItem('en_userTasks_' + uid, JSON.stringify(val[uid]));
                    }
                } else {
                    localStorage.setItem('en_' + key, JSON.stringify(val));
                }
                if (firebaseReady) {
                    firebaseDb.ref('/' + key).set(val).catch(err => {
                        console.warn('⚠️ Firebase write error for', key, err);
                    });
                }
            },

            remove(key) {
                delete this._cache[key];
                localStorage.removeItem('en_' + key);
                if (firebaseReady) {
                    firebaseDb.ref('/' + key).remove().catch(err => {
                        console.warn('⚠️ Firebase remove error for', key, err);
                    });
                }
            },

            getUserTasks(userId) {
                const all = this.get('userTasks', {});
                return all[userId] || { completed: [], date: '' };
            },

            setUserTasks(userId, data) {
                const all = this.get('userTasks', {});
                all[userId] = data;
                this.set('userTasks', all);
            },

            generateId() {
                return String(Date.now()) + '-' + String(Math.floor(Math.random() * 10000));
            }
        };

        // ============================================================
        // 3. THEME MANAGER
        // ============================================================
        const ThemeManager = {
            current: 'dark',

            init() {
                const saved = localStorage.getItem('en_theme') || 'dark';
                this.current = saved;
                this.apply(saved);
            },

            apply(theme) {
                if (theme === 'light') {
                    document.documentElement.setAttribute('data-theme', 'light');
                } else {
                    document.documentElement.removeAttribute('data-theme');
                }
                this.current = theme;
                localStorage.setItem('en_theme', theme);
                const toggle = document.getElementById('themeToggleBtn');
                if (toggle) {
                    toggle.textContent = theme === 'light' ? '☀️' : '🌙';
                }
            },

            toggle() {
                const next = this.current === 'light' ? 'dark' : 'light';
                this.apply(next);
                if (window.APP && window.APP._refreshScreen) {
                    window.APP._refreshScreen();
                }
            },

            getIcon() {
                return this.current === 'light' ? '☀️' : '🌙';
            }
        };

        // ============================================================
        // 4. MAIN APP
        // ============================================================
        const APP = (() => {

            // ── STORE wrapper ──
            const STORE = {
                get(key, def) { return DataManager.get(key, def); },
                set(key, val) { DataManager.set(key, val); },
                remove(key) { DataManager.remove(key); },
                getUserTasks(userId) { return DataManager.getUserTasks(userId); },
                setUserTasks(userId, data) { DataManager.setUserTasks(userId, data); },
                generateId() { return DataManager.generateId(); }
            };

            // ── Helpers ──
            function getTodayDateStr() { return new Date().toISOString().split('T')[0]; }

            function checkAndResetDailyTasks(userId) {
                const userTasks = STORE.getUserTasks(userId);
                const lastDate = userTasks.date || '';
                const today = getTodayDateStr();
                if (lastDate !== today) {
                    userTasks.completed = [];
                    userTasks.date = today;
                    STORE.setUserTasks(userId, userTasks);
                    applyDailyDecay(userId);
                }
            }

            function applyDailyDecay(userId) {
                const users = STORE.get('users');
                const userIdx = users.findIndex(u => u.id === userId);
                if (userIdx === -1) return;
                const user = users[userIdx];
                if (user.isSpecial) return;
                if (user.refCount > 0) return;
                if (user.perTaskEarning > 0.001) {
                    const newEarning = Math.max(0.001, user.perTaskEarning - 0.001);
                    users[userIdx].perTaskEarning = newEarning;
                    STORE.set('users', users);
                }
            }

            function generateImageAdTask(index) {
                const canvas = document.createElement('canvas');
                canvas.width = 320;
                canvas.height = 180;
                const ctx = canvas.getContext('2d');
                const colors = ['#f7931a', '#3b82f6', '#10b981', '#ef4444', '#8b5cf6', '#ec4899', '#f59e0b', '#6366f1'];
                ctx.fillStyle = colors[index % colors.length];
                ctx.fillRect(0, 0, 320, 180);
                ctx.fillStyle = '#ffffff';
                ctx.font = 'bold 28px sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText(`AD ${index + 1}`, 160, 60);
                ctx.font = '16px sans-serif';
                ctx.fillText('Earn Rewards', 160, 110);
                ctx.fillText('Elite Nation', 160, 140);
                return canvas.toDataURL('image/png');
            }

            function initData() {
                if (!STORE.get('users')) STORE.set('users', []);
                if (!STORE.get('pendingFee')) STORE.set('pendingFee', []);
                if (!STORE.get('pendingWithdrawals')) STORE.set('pendingWithdrawals', []);
                if (!STORE.get('approvedWithdrawals')) STORE.set('approvedWithdrawals', []);
                if (!STORE.get('tasks')) {
                    const tasks = [];
                    for (let i = 0; i < 20; i++) tasks.push({ id: 'task_img_' + i, code: '', image: generateImageAdTask(
                            i), createdAt: Date.now() });
                    STORE.set('tasks', tasks);
                }
                if (!STORE.get('marqueeText')) STORE.set('marqueeText', '🔥 Welcome to Elite Nation! Complete tasks & earn rewards. New plans available! 🚀');
                if (!STORE.get('companyDocs')) STORE.set('companyDocs', []);
                if (!STORE.get('chatMessages')) STORE.set('chatMessages', []);
                if (!STORE.get('subAdmins')) STORE.set('subAdmins', []);

            function handleRegister() {
                const name = document.getElementById('regName')?.value.trim();
                const email = document.getElementById('regEmail')?.value.trim();
                const whatsapp = document.getElementById('regWhatsapp')?.value.trim();
                const city = document.getElementById('regCity')?.value.trim();
                const address = document.getElementById('regAddress')?.value.trim();
                const country = document.getElementById('regCountry')?.value;
                const password = document.getElementById('regPassword')?.value;
                let refCode = document.getElementById('regRefCode')?.value.trim();
                // If input is empty but we have referral from URL, use that
                if (!refCode && _referralCode) {
                    refCode = _referralCode;
                }
                if (!name || !email || !whatsapp || !city || !address || !password) return showToast(
                    'Please fill all required fields!');
                let users = STORE.get('users');
                if (users.find(u => u.email === email)) return showToast('Email already registered!');
                const newUser = {
                    id: generateID(),
                    fullName: name,
                    email,
                    password,
                    whatsapp,
                    city,
                    address,
                    country,
                    referralCode: refCode || '',
                    isAdmin: false,
                    isApproved: false,
                    isSpecial: false,
                    specialEarning: null,
                    currentBalance: 0,
                    totalBalance: 0,
                    perTaskEarning: 0.01,
                    plan: null,
                    profilePic: '',
                    createdAt: Date.now(),
                    refCount: 0,
                    referredBy: refCode || null,
                    levelBonusClaimed: {},
                    withdrawCount: 0,
                    isBlocked: false,
                    isSubAdmin: false,
                };
                users.push(newUser);
                STORE.set('users', users);
                STORE.set('currentUserId', newUser.id);
                showToast('Your account has been successfully registered!');
                setTimeout(() => screenPaymentForm(), 600);
            }

            function approveFee(idx) {
                let pendingFee = STORE.get('pendingFee');
                const payment = pendingFee[idx];
                if (!payment) return;
                pendingFee.splice(idx, 1);
                STORE.set('pendingFee', pendingFee);
                let users = STORE.get('users');
                const userIdx = users.findIndex(u => u.id === payment.userId);
                if (userIdx >= 0) {
                    users[userIdx].isApproved = true;
                    users[userIdx].plan = payment.plan;
                    if (users[userIdx].referredBy) {
                        const ref1 = users.find(u => u.id === users[userIdx].referredBy);
                        if (ref1) {
                            ref1.currentBalance += 0.4;

            function _refreshScreen() {
                const user = getCurrentUser();
                if (!user) return screenLogin();
                if (user.isAdmin && !user.isSubAdmin) screenAdminDashboard();
                else if (user.isSubAdmin) screenSubAdminDashboard();
                else if (!user.isApproved) {
                    const pendingFee = STORE.get('pendingFee');
                    if (pendingFee.find(p => p.userId === user.id)) screenPendingApproval();
                    else screenPaymentForm();
                } else if (user.isBlocked) screenUserDashboard();
                else screenUserDashboard();
            }

            // ── Init ──
            function init() {
                // Check for referral in URL before anything else
                parseReferralFromURL();

                // Load local data and set up Firebase listener (non-blocking)
                DataManager.init();

                // Initialize default data if needed
                initData();

                // Theme
                ThemeManager.init();

                // React to Firebase updates
                DataManager.onChange((data) => {
                    const user = getCurrentUser();
                    if (user && user.isApproved && !user.isAdmin && !user.isSubAdmin) {
                        const activeScreen = container.querySelector('.screen.active');
                        if (activeScreen && activeScreen.querySelector('.dashboard-header')) {
                            screenUserDashboard();
                        }
                    }
                });

                // Determine which screen to show based on current user
                const uid = STORE.get('currentUserId');
                if (uid) {
                    const user = findUserById(uid);
                    if (user) {
                        if (user.isAdmin && !user.isSubAdmin) screenAdminDashboard();
                        else if (user.isSubAdmin) screenSubAdminDashboard();
                        else if (!user.isApproved) {
                            const pendingFee = STORE.get('pendingFee');
                            if (pendingFee.find(p => p.userId === user.id)) screenPendingApproval();
                            else screenPaymentForm();
                        } else if (user.isBlocked) screenUserDashboard();
                        else screenUserDashboard();
                    } else screenLogin();
                } else {
                    // If referral code exists, show registration with it pre-filled
                    if (_referralCode) {
                        screenRegister();
                    } else {
                        screenLogin();
                    }
                }

                if (firebaseReady) {
                    console.log('✅ Firebase connected & synced (Elite Nation v2)');
                } else {
                    console.log('📁 Using localStorage (offline mode)');
                }
            }

            // ── Expose ──
            return {
                screenRegister,
                screenLogin,
                screenPaymentForm,
                screenPendingApproval,
                screenUserDashboard,
                screenAdminDashboard,
                screenSubAdminDashboard,
                handleRegister,
                handleLogin,
                logout,
                selectPlan,
                switchPaymentTab,
                submitPayment,
                completeTask,
                confirmTaskComplete,
                openWithdraw,
                switchWithdrawTab,
                submitWithdraw,
                openWithdrawHistory,
                openTasks,
                completeTaskFromModal,
                openReferral,
                openTeam,
                viewRefTeam,
                openLevels,
                claimLevelBonus,
                openProfile,
                changeName,
                uploadProfilePic,
                changePassword,
                openCustomerService,
                sendChatMsg,
                deleteChatMsg,
                zoomImage,
                openNotifications,
                openCompanyDocs,
                adminPendingFee,
                approveFee,
                rejectFee,
                adminPendingWithdrawals,
                approveWithdrawal,
                rejectWithdrawal,
                adminUsers,
                toggleBlockUser,
                adminTasks,
                addTask,
                deleteTask,
                adminSpecial,
                makeSpecial,
                updateSpecialEarning,
                removeSpecial,
                adminNotifications,
                adminChat,
                adminSendChat,
                adminProfile,
                uploadAdminPic,
                changeAdminPass,
                adminCompanyDocs,
                uploadCompanyDoc,
                deleteCompanyDoc,
                adminSubAdmins,
                addSubAdmin,
                editSubAdmin,
                saveEditSubAdmin,
                removeSubAdmin,
                adminPaymentConfig,
                savePaymentConfig,
                adminMarquee,
                saveMarquee,
                toggleTheme,
                closeModal,
                showToastMsg,
                _refreshScreen,
                init,
                _selectedPlanIdx: 0,
                _paymentMethod: 'jazzcash',
                _withdrawTab: 'jazzcash',
            };
        })();

        // ── Start ──
        document.addEventListener('DOMContentLoaded', () => {
            APP.init();
            window.APP = APP;
        });
    </script>
</body>

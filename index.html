<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Elite Nation</title>

    <!-- Firebase SDKs (compat) -->
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js">
    </script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js">
    </script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js">
    </script>

    <style>
        /* ----- THEME VARIABLES (light / dark) ----- */
        :root {
            --bg: #f1f5f9;
            --bg2: #ffffff;
            --bg3: #f8fafc;
            --bg4: #e9edf2;
            --card: #ffffff;
            --card2: #eef2f6;
            --border: #d1d9e6;
            --text: #0f172a;
            --text2: #334155;
            --text3: #64748b;
            --input: #f1f5f9;
            --shadow: 0 4px 24px rgba(0, 0, 0, 0.08);
            --accent: #f7931a;
            --accent2: #3b82f6;
            --gold: #f59e0b;
            --green: #10b981;
            --red: #ef4444;
            --accent-glow: #f7931a30;
            --radius: 14px;
            --transition: 0.3s ease;
        }

        [data-theme="dark"] {
            --bg: #0a0e17;
            --bg2: #111827;
            --bg3: #1a1f2e;
            --bg4: #0f1520;
            --card: #111827;
            --card2: #1e293b;
            --border: #1e293b;
            --text: #e2e8f0;
            --text2: #94a3b8;
            --text3: #64748b;
            --input: #1a1f2e;
            --shadow: 0 4px 24px rgba(0, 0, 0, 0.5);
            --accent-glow: #f7931a40;
        }

        /* ----- RESET & BASE ----- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            overflow-x: hidden;
            transition: background var(--transition), color var(--transition);
            -webkit-tap-highlight-color: transparent;
        }
        .app-container {
            max-width: 480px;
            margin: 0 auto;
            min-height: 100vh;
            position: relative;
            background: var(--bg);
            box-shadow: var(--shadow);
            transition: background var(--transition);
        }
        @media(min-width:768px) {
            .app-container {
                max-width: 500px;
                border-left: 1px solid var(--border);
                border-right: 1px solid var(--border);
            }
        }

        /* ----- SCREENS ----- */
        .screen {
            display: none;
            padding: 20px 16px;
            min-height: 100vh;
            animation: fadeIn 0.35s ease;
        }
        .screen.active {
            display: block;
        }
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(12px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* ----- LOGO ----- */
        .logo {
            text-align: center;
            font-size: 2rem;
            font-weight: 800;
            letter-spacing: -1px;
            background: linear-gradient(135deg, #f7931a, #f59e0b);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 4px;
        }
        .logo-sub {
            text-align: center;
            font-size: 0.8rem;
            color: var(--text2);
            margin-bottom: 20px;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        /* ----- CARDS ----- */
        .card {
            background: var(--card);
            border-radius: var(--radius);
            padding: 20px;
            margin-bottom: 14px;
            border: 1px solid var(--border);
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.06);
            transition: background var(--transition), border var(--transition);
        }
        .card h3 {
            font-size: 1rem;
            margin-bottom: 12px;
            color: var(--text);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* ----- INPUTS (font-size >= 16px for mobile) ----- */
        input,
        select,
        textarea {
            width: 100%;
            padding: 13px 14px;
            border-radius: 10px;
            border: 1px solid var(--border);
            background: var(--input);
            color: var(--text);
            font-size: 16px; /* prevents zoom on iOS */
            margin-bottom: 10px;
            transition: all 0.2s;
            font-family: inherit;
        }
        input:focus,
        select:focus,
        textarea:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--accent-glow);
        }
        textarea {
            resize: vertical;
            min-height: 80px;
        }

        /* ----- BUTTONS (touch-friendly) ----- */
        .btn {
            padding: 13px 20px;
            border-radius: 10px;
            border: none;
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.25s;
            width: 100%;
            letter-spacing: 0.3px;
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
        }
        .btn-gold {
            background: linear-gradient(135deg, #f7931a, #e67e0e);
            color: #000;
            box-shadow: 0 4px 14px var(--accent-glow);
        }
        .btn-gold:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 22px var(--accent-glow);
        }
        .btn-blue {
            background: linear-gradient(135deg, #3b82f6, #2563eb);
            color: #fff;
            box-shadow: 0 4px 14px #3b82f640;
        }
        .btn-blue:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 22px #3b82f655;
        }
        .btn-outline {
            background: transparent;
            border: 2px solid var(--border);
            color: var(--text);
        }
        .btn-outline:hover {
            border-color: var(--accent);
            color: var(--accent);
        }
        .btn-sm {
            padding: 8px 14px;
            font-size: 0.78rem;
            width: auto;
            border-radius: 8px;
        }
        .btn-danger {
            background: var(--red);
            color: #fff;
        }
        .btn-danger:hover {
            filter: brightness(0.85);
        }
        .btn-success {
            background: var(--green);
            color: #fff;
        }
        .btn-success:hover {
            filter: brightness(0.85);
        }

        /* ----- GRIDS ----- */
        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }
        .grid-3 {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
        }

        /* ----- BADGES ----- */
        .badge {
            display: inline-block;
            padding: 5px 10px;
            border-radius: 20px;
            font-size: 0.7rem;
            font-weight: 600;
            letter-spacing: 0.5px;
        }
        .badge-gold {
            background: #f7931a20;
            color: #f7931a;
        }
        .badge-green {
            background: #10b98120;
            color: #10b981;
        }
        .badge-red {
            background: #ef444420;
            color: #ef4444;
        }
        .badge-blue {
            background: #3b82f620;
            color: #3b82f6;
        }

        /* ----- DASHBOARD HEADER ----- */
        .dashboard-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 0;
            border-bottom: 1px solid var(--border);
            margin-bottom: 14px;
            flex-wrap: wrap;
            gap: 8px;
        }
        .user-info-top {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .avatar {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            background: var(--accent);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            color: #000;
            font-size: 1.1rem;
            overflow: hidden;
            flex-shrink: 0;
        }
        .avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* ----- MARQUEE ----- */
        .marquee-bar {
            background: var(--accent-glow);
            border: 1px solid rgba(247, 147, 26, 0.25);
            border-radius: 8px;
            padding: 10px 14px;
            margin-bottom: 14px;
            overflow: hidden;
            white-space: nowrap;
            font-size: 0.8rem;
            color: var(--accent);
            letter-spacing: 0.5px;
        }
        .marquee-bar span {
            display: inline-block;
            animation: marquee 14s linear infinite;
        }
        @keyframes marquee {
            0% {
                transform: translateX(100%);
            }
            100% {
                transform: translateX(-100%);
            }
        }

        /* ----- ICON GRID (touch-friendly) ----- */
        .icon-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
        }
        .icon-item {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 16px 10px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 0.75rem;
            color: var(--text2);
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }
        .icon-item:hover {
            border-color: var(--accent);
            color: var(--text);
            transform: translateY(-2px);
        }
        .icon-item .ico {
            font-size: 1.6rem;
            display: block;
            margin-bottom: 6px;
        }

        /* ----- PLAN CARD ----- */
        .plan-card {
            border: 2px solid var(--border);
            border-radius: var(--radius);
            padding: 16px;
            cursor: pointer;
            transition: all 0.25s;
            text-align: center;
            background: var(--card);
            touch-action: manipulation;
            user-select: none;
        }
        .plan-card:hover,
        .plan-card.selected {
            border-color: var(--accent);
            box-shadow: 0 0 20px var(--accent-glow);
        }
        .plan-card h4 {
            font-size: 1.1rem;
            margin-bottom: 4px;
        }
        .plan-card .price {
            font-size: 1.4rem;
            font-weight: 700;
            color: var(--accent);
        }

        /* ----- MODAL ----- */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
            z-index: 999;
            display: flex;
            align-items: center;
            justify-content: center;
            animation: fadeIn 0.2s;
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
        }
        .modal {
            background: var(--card);
            border-radius: var(--radius);
            padding: 24px;
            width: 90%;
            max-width: 440px;
            max-height: 80vh;
            overflow-y: auto;
            border: 1px solid var(--border);
            transition: background var(--transition);
        }
        .modal::-webkit-scrollbar {
            width: 4px;
        }
        .modal::-webkit-scrollbar-thumb {
            background: var(--accent);
            border-radius: 4px;
        }

        /* ----- NOTIFICATION BADGE ----- */
        .notification-badge {
            position: relative;
            cursor: pointer;
            font-size: 1.4rem;
            touch-action: manipulation;
        }
        .notification-badge .count {
            position: absolute;
            top: -6px;
            right: -8px;
            background: var(--red);
            color: #fff;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            font-size: 0.65rem;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
        }

        /* ----- TABS ----- */
        .tab-nav {
            display: flex;
            gap: 4px;
            margin-bottom: 14px;
            flex-wrap: wrap;
        }
        .tab-nav button {
            padding: 8px 16px;
            border-radius: 20px;
            border: 1px solid var(--border);
            background: transparent;
            color: var(--text2);
            cursor: pointer;
            font-size: 0.78rem;
            transition: all 0.2s;
            touch-action: manipulation;
        }
        .tab-nav button.active {
            background: var(--accent);
            color: #000;
            border-color: var(--accent);
            font-weight: 600;
        }
        .tab-nav button:hover:not(.active) {
            border-color: var(--accent);
            color: var(--text);
        }

        /* ----- CHAT ----- */
        .chat-bubble {
            padding: 10px 14px;
            border-radius: 16px;
            margin: 6px 0;
            max-width: 80%;
            font-size: 0.85rem;
            word-break: break-word;
        }
        .chat-bubble.user {
            background: var(--accent2);
            color: #fff;
            margin-left: auto;
            border-bottom-right-radius: 4px;
        }
        .chat-bubble.admin {
            background: var(--card2);
            color: var(--text);
            margin-right: auto;
            border-bottom-left-radius: 4px;
        }
        .chat-image {
            max-width: 200px;
            border-radius: 10px;
            cursor: zoom-in;
            display: block;
            margin: 4px 0;
        }

        /* ----- TOAST ----- */
        .toast {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--card);
            border: 1px solid var(--accent);
            padding: 12px 20px;
            border-radius: 30px;
            z-index: 9999;
            font-weight: 600;
            font-size: 0.85rem;
            animation: fadeIn 0.3s;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.2);
            transition: background var(--transition);
            max-width: 90%;
            text-align: center;
        }

        /* ----- THEME TOGGLE BUTTON ----- */
        .theme-toggle {
            background: var(--card2);
            border: 1px solid var(--border);
            border-radius: 30px;
            padding: 6px 14px;
            cursor: pointer;
            font-size: 1.2rem;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: all 0.2s;
            color: var(--text);
            touch-action: manipulation;
        }
        .theme-toggle:hover {
            border-color: var(--accent);
        }
        .theme-toggle .icon {
            line-height: 1;
        }

        /* ----- LOADING SHIMMER ----- */
        .loading-shimmer {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 0;
            color: var(--text2);
            font-size: 0.9rem;
        }
        .loading-shimmer::after {
            content: '⏳';
            margin-left: 8px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            100% {
                transform: rotate(360deg);
            }
        }

        /* ----- RESPONSIVE TWEAKS ----- */
        @media(max-width:400px) {
            .icon-grid {
                grid-template-columns: repeat(3, 1fr);
                gap: 6px;
            }
            .icon-item {
                padding: 12px 6px;
                font-size: 0.65rem;
            }
            .icon-item .ico {
                font-size: 1.3rem;
            }
            .grid-3 {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        /* Scrollbar */
        ::-webkit-scrollbar {
            width: 4px;
        }
        ::-webkit-scrollbar-thumb {
            background: var(--accent);
            border-radius: 4px;
        }
        ::-webkit-scrollbar-track {
            background: var(--bg);
        }
    </style>
</head>
<body>

    <div class="app-container" id="appContainer"></div>
    <div id="toastContainer"></div>
    <div id="modalContainer"></div>
    <audio id="notifSound" preload="auto">
        <source src="data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEARKwAAIhYAQACABAAZGF0YQAAAAA=" type="audio/wav">
    </audio>

    <script>
        // ============================================================
        //  1.  FIREBASE INIT
        // ============================================================
        const firebaseConfig = {
            apiKey: "AIzaSyD3kx-6nxyDeIpXxgBu0LIPB0xYwZdVIVk",
            authDomain: "elite-nation-6c822.firebaseapp.com",
            databaseURL: "https://elite-nation-6c822-default-rtdb.firebaseio.com",
            projectId: "elite-nation-6c822",
            storageBucket: "elite-nation-6c822.firebasestorage.app",
            messagingSenderId: "541886818416",
            appId: "1:541886818416:web:ed79ed56cac606427e2cb5"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        const auth = firebase.auth();

        // ============================================================
        //  2.  DATA SERVICE  (Firebase Realtime Database)
        // ============================================================
        const DB = {
            // ---- helpers ----
            _ref(path) { return db.ref('elite_nation/' + path); },
            _push(path, data) { return this._ref(path).push(data); },
            _set(path, data) { return this._ref(path).set(data); },
            _get(path) { return this._ref(path).once('value').then(snap => snap.val()); },
            _update(path, data) { return this._ref(path).update(data); },
            _remove(path) { return this._ref(path).remove(); },

            // ---- users ----
            async getUsers() { return (await this._get('users')) || {}; },
            async getUser(userId) { return (await this._get('users/' + userId)) || null; },
            async setUser(userId, data) { return this._set('users/' + userId, data); },
            async updateUser(userId, data) { return this._update('users/' + userId, data); },
            async deleteUser(userId) { return this._remove('users/' + userId); },
            async getAllUsersArray() {
                const obj = await this.getUsers();
                return Object.values(obj).filter(u => u && typeof u === 'object');
            },

            // ---- pendingFee ----
            async getPendingFee() { return (await this._get('pendingFee')) || {}; },
            async addPendingFee(data) { return this._push('pendingFee', data); },
            async removePendingFee(key) { return this._remove('pendingFee/' + key); },
            async getPendingFeeArray() {
                const obj = await this.getPendingFee();
                return Object.keys(obj).map(k => ({ ...obj[k], _key: k }));
            },

            // ---- pendingWithdrawals ----
            async getPendingWithdrawals() { return (await this._get('pendingWithdrawals')) || {}; },
            async addPendingWithdrawal(data) { return this._push('pendingWithdrawals', data); },
            async removePendingWithdrawal(key) { return this._remove('pendingWithdrawals/' + key); },
            async getPendingWithdrawalsArray() {
                const obj = await this.getPendingWithdrawals();
                return Object.keys(obj).map(k => ({ ...obj[k], _key: k }));
            },

            // ---- approvedWithdrawals ----
            async getApprovedWithdrawals() { return (await this._get('approvedWithdrawals')) || {}; },
            async addApprovedWithdrawal(data) { return this._push('approvedWithdrawals', data); },
            async getApprovedWithdrawalsArray() {
                const obj = await this.getApprovedWithdrawals();
                return Object.keys(obj).map(k => ({ ...obj[k], _key: k }));
            },

            // ---- tasks ----
            async getTasks() { return (await this._get('tasks')) || {}; },
            async addTask(data) { return this._push('tasks', data); },
            async removeTask(key) { return this._remove('tasks/' + key); },
            async getTasksArray() {
                const obj = await this.getTasks();
                return Object.keys(obj).map(k => ({ ...obj[k], _key: k }));
            },

            // ---- notifications ----
            async getNotifications() { return (await this._get('notifications')) || {}; },
            async addNotification(data) { return this._push('notifications', data); },
            async updateNotification(key, data) { return this._update('notifications/' + key, data); },
            async getNotificationsArray() {
                const obj = await this.getNotifications();
                return Object.keys(obj).map(k => ({ ...obj[k], _key: k }));
            },

            // ---- marqueeText ----
            async getMarqueeText() { return (await this._get('marqueeText')) || '🔥 Welcome to Elite Nation! 🚀'; },
            async setMarqueeText(text) { return this._set('marqueeText', text); },

            // ---- companyDocs ----
            async getCompanyDocs() { return (await this._get('companyDocs')) || {}; },
            async addCompanyDoc(data) { return this._push('companyDocs', data); },
            async removeCompanyDoc(key) { return this._remove('companyDocs/' + key); },
            async getCompanyDocsArray() {
                const obj = await this.getCompanyDocs();
                return Object.keys(obj).map(k => ({ ...obj[k], _key: k }));
            },

            // ---- chatMessages ----
            async getChatMessages() { return (await this._get('chatMessages')) || {}; },
            async addChatMessage(data) { return this._push('chatMessages', data); },
            async removeChatMessage(key) { return this._remove('chatMessages/' + key); },
            async getChatMessagesArray() {
                const obj = await this.getChatMessages();
                return Object.keys(obj).map(k => ({ ...obj[k], _key: k }));
            },

            // ---- subAdmins ----
            async getSubAdmins() { return (await this._get('subAdmins')) || {}; },
            async addSubAdmin(data) { return this._push('subAdmins', data); },
            async updateSubAdmin(key, data) { return this._update('subAdmins/' + key, data); },
            async removeSubAdmin(key) { return this._remove('subAdmins/' + key); },
            async getSubAdminsArray() {
                const obj = await this.getSubAdmins();
                return Object.keys(obj).map(k => ({ ...obj[k], _key: k }));
            },

            // ---- paymentConfig ----
            async getPaymentConfig() {
                const cfg = await this._get('paymentConfig');
                if (!cfg) {
                    const def = {
                        jazzcashNumber: '03027527798',
                        jazzcashTitle: 'Mansoor Ahmad',
                        plans: [
                            { name: 'Starter Plan', price: 750, usd: 2.7, ads: 5 },
                            { name: 'Golden Plan', price: 1500, usd: 5.5, ads: 10 },
                            { name: 'Demand Plan', price: 3000, usd: 12, ads: 15 }
                        ],
                        cryptoFeeUSD: 5,
                        usdtAddress: '0x3367fF2bB10E0aF800A86F79cd69Ab58FA2ef59B',
                        usdcAddress: '0x3367fF2bB10E0aF800A86F79cd69Ab58FA2ef59B',
                        withdrawalMethods: ['JazzCash', 'EasyPaisa', 'Upaisa'],
                        enableCryptoWithdraw: true
                    };
                    await this._set('paymentConfig', def);
                    return def;
                }
                return cfg;
            },
            async setPaymentConfig(data) { return this._set('paymentConfig', data); },

            // ---- adminProfilePic ----
            async getAdminProfilePic() { return (await this._get('adminProfilePic')) || ''; },
            async setAdminProfilePic(url) { return this._set('adminProfilePic', url); },

            // ---- userTasks (per user) ----
            async getUserTasks(userId) {
                const data = await this._get('userTasks/' + userId);
                return data || { completed: [], lastDate: '' };
            },
            async setUserTasks(userId, data) {
                return this._set('userTasks/' + userId, data);
            },

            // ---- currentUserId ----
            async getCurrentUserId() { return (await this._get('currentUserId')) || null; },
            async setCurrentUserId(uid) {
                if (uid) return this._set('currentUserId', uid);
                else return this._remove('currentUserId');
            },

            // ---- generate new user id ----
            async generateUserId() {
                const users = await this.getUsers();
                let id;
                let exists = true;
                let attempts = 0;
                while (exists && attempts < 100) {

            async function submitPayment() {
                const user = getCurrentUser();
                if (!user) return;
                const config = await DB.getPaymentConfig();
                const plan = config.plans[_selectedPlanIdx || 0];
                const method = _paymentMethod || 'jazzcash';

                let paymentData = {
                    userId: user.id,
                    userName: user.fullName,
                    plan: plan.name,
                    amount: plan.price,
                    usdAmount: plan.usd,
                    method,
                    time: Date.now()
                };

                if (method === 'jazzcash') {
                    paymentData.accountName = document.getElementById('payAccountName')?.value || '';
                    paymentData.accountNumber = document.getElementById('payAccountNumber')?.value || '';
                    paymentData.transactionId = document.getElementById('payTransactionId')?.value || '';
                    const fileInput = document.getElementById('payScreenshot');
                    if (fileInput?.files[0]) {
                        const reader = new FileReader();
                        reader.onload = async function(e) {
                            paymentData.screenshot = e.target.result;
                            await finalizePayment(paymentData, plan);
                        };
                        reader.readAsDataURL(fileInput.files[0]);
                        return;
                    }

            async function submitWithdraw() {
                const user = getCurrentUser();
                if (!user) return;
                const config = await DB.getPaymentConfig();
                const tab = _withdrawTab || 'jazzcash';
                const wCount = user.withdrawCount || 0;
                let minAmount, amount;
                let withdrawData = {
                    userId: user.id,
                    userName: user.fullName,
                    method: tab,
                    time: Date.now(),
                    status: 'pending'
                };

                if (tab === 'jazzcash') {
                    minAmount = wCount === 0 ? 0.5 : wCount === 1 ? 1.2 : 1.6;
                    amount = parseFloat(document.getElementById('wAmount')?.value);
                    withdrawData.accountNumber = document.getElementById('wAccountNumber')?.value || '';
                    withdrawData.accountTitle = document.getElementById('wAccountTitle')?.value || '';
                    withdrawData.subMethod = document.getElementById('wMethod')?.value || config.withdrawalMethods[0];
                    if (!withdrawData.accountNumber || !withdrawData.accountTitle) return showToast('Please fill all fields!');
                } else {
                    minAmount = wCount === 0 ? 1.5 : wCount === 1 ? 2.7 : 3.9;
                    amount = parseFloat(document.getElementById('wCryptoAmount')?.value);
                    withdrawData.walletAddress = document.getElementById('wWalletAddress')?.value || '';
                    withdrawData.cryptoType = document.getElementById('wCryptoType')?.value || 'USDT ERC20';
                    if (!withdrawData.walletAddress) return showToast('Please enter wallet address!');
                }
                if (!amount || amount < minAmount) return showToast(`Minimum withdrawal is $${minAmount}!`);
                if (amount > user.currentBalance) return showToast('Insufficient balance!');

                withdrawData.amount = amount;
                await DB.addPendingWithdrawal(withdrawData);
                const newBal = user.currentBalance - amount;
                await DB.updateUser(user.id, {
                    currentBalance: newBal,
                    withdrawCount: wCount + 1
                });
                user.currentBalance = newBal;
                user.withdrawCount = wCount + 1;
                _currentUser = user;

                await DB.addNotification({
                    userId: '000001',
                    msg: `New withdrawal request from ${user.fullName} for $${amount}`,
                    read: false,
                    time: Date.now()
                });
                showToast('Withdrawal submitted!');
                closeModal();
                screenUserDashboard();
            }

            async function approveFee(key) {
                const pending = await DB.getPendingFeeArray();
                const payment = pending.find(p => p._key === key);
                if (!payment) return;
                await DB.removePendingFee(key);

                const user = await DB.getUser(payment.userId);
                if (user) {
                    user.isApproved = true;
                    user.plan = payment.plan;
                    // referral bonuses
                    if (user.referredBy) {
                        const ref1 = await DB.getUser(user.referredBy);
                        if (ref1) {
                            ref1.currentBalance = (ref1.currentBalance || 0) + 0.4;
                            ref1.totalBalance = (ref1.totalBalance || 0) + 0.4;
                            ref1.refCount = (ref1.refCount || 0) + 1;
                            ref1.perTaskEarning = (ref1.perTaskEarning || 0.01) + 0.008;
                            await DB.updateUser(ref1.id, ref1);
                            await DB.addNotification({
                                userId: ref1.id,
                                msg: 'You earned $0.4 referral bonus!',
                                read: false,
                                time: Date.now()
                            });
                            // level 2
                            if (ref1.referredBy) {
                                const ref2 = await DB.getUser(ref1.referredBy);
                                if (ref2) {
                                    ref2.currentBalance = (ref2.currentBalance || 0) + 0.1;

            async function adminSendChat() {
                const text = document.getElementById('adminChatMsg')?.value.trim();
                const fileInput = document.getElementById('adminChatImg');
                const target = document.getElementById('adminChatTarget')?.value;
                const msgObj = {
                    userId: '000001',
                    userName: 'Admin',
                    text: text || '',
                    fromAdmin: true,
                    time: Date.now(),
                    image: null,
                    toUserId: target === 'all' ? null : target,
                    broadcast: target === 'all'
                };

                const processMsg = async (imgData) => {
                    if (imgData) msgObj.image = imgData;
                    if (target === 'all') {
                        const users = await DB.getAllUsersArray();
                        const approved = users.filter(u => !u.isAdmin && u.isApproved);
                        for (const u of approved) {
                            const m = { ...msgObj, toUserId: u.id, broadcast: true };
                            await DB.addChatMessage(m);
                            await DB.addNotification({
                                userId: u.id,
                                msg: '📢 Broadcast: ' + (text || '[Image]'),
                                read: false,
                                time: Date.now()
                            });
                        }
                    } else {
                        await DB.addChatMessage(msgObj);
                        await DB.addNotification({
                            userId: target,
                            msg: 'New message from Admin',
                            read: false,
                            time: Date.now()
                        });
                    }
                    closeModal();
                    adminChat();
                };

                if (fileInput?.files[0]) {
                    const reader = new FileReader();
                    reader.onload = function(e) { processMsg(e.target.result); };
                    reader.readAsDataURL(fileInput.files[0]);
                    return;
                }
                if (!text) return;
                processMsg(null);
            }

                config.jazzcashTitle = document.getElementById('cfgJazzTitle')?.value || config.jazzcashTitle;
                config.usdtAddress = document.getElementById('cfgUsdt')?.value || config.usdtAddress;
                config.usdcAddress = document.getElementById('cfgUsdc')?.value || config.usdcAddress;
                config.cryptoFeeUSD = parseFloat(document.getElementById('cfgCryptoFee')?.value) || config.cryptoFeeUSD;
                const methodsStr = document.getElementById('cfgWithdrawMethods')?.value || 'JazzCash, EasyPaisa, Upaisa';
                config.withdrawalMethods = methodsStr.split(',').map(m => m.trim()).filter(m => m);
                config.enableCryptoWithdraw = document.getElementById('cfgCryptoWithdraw')?.checked || false;
                await DB.setPaymentConfig(config);
                showToast('Configuration saved!');
                closeModal();

                        ctx.fillStyle = colors[i % colors.length];
                        ctx.fillRect(0, 0, 320, 180);
                        ctx.fillStyle = '#ffffff';
                        ctx.font = 'bold 28px sans-serif';
                        ctx.textAlign = 'center';
